# Обновления зависимостей (ADR-0011). Каждый PR Dependabot проходит CI; обновление без смены
# поведения ADR не требует (ADR-0052).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Версия — как у kotlinx-coroutines, которые приложению приносит AndroidX (сейчас 1.9.0):
      # тесты должны идти на тех же корутинах. Поднимай вручную вслед за AndroidX
      - dependency-name: org.jetbrains.kotlinx:kotlinx-coroutines-test
    groups:
      # ADR-0052: Gradle, AGP, Kotlin и KSP обновляются вместе
      toolchain:
        patterns:
          - gradle-wrapper
          - com.android.*
          - org.jetbrains.kotlin.*
          - com.google.devtools.ksp*
      androidx:
        patterns:
          - androidx.*
      # ADR-0013: плагин и обе библиотеки Roborazzi обновляются одной версией
      roborazzi:
        patterns:
          - io.github.takahirom.roborazzi*

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: swift
    directory: /ios/
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
