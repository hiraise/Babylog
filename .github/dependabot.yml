# Обновления зависимостей (ADR-0011). Каждый PR Dependabot проходит CI; обновление без смены
# поведения ADR не требует (ADR-0006). Суммы новых версий Dependabot не пишет: в его ветке нужен
# scripts/dev.sh deps, иначе CI упадёт на проверке зависимостей (ADR-0034)
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Версия — как у kotlinx-coroutines, которые приложению приносит AndroidX (сейчас 1.9.0):
      # тесты должны идти на тех же корутинах. Поднимай вручную вслед за AndroidX
      - dependency-name: org.jetbrains.kotlinx:kotlinx-coroutines-test
    groups:
      # ADR-0006: Gradle, AGP, Kotlin и KSP обновляются вместе
      toolchain:
        patterns:
          - gradle-wrapper
          - com.android.*
          - org.jetbrains.kotlin.*
          - com.google.devtools.ksp*
      androidx:
        patterns:
          - androidx.*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
