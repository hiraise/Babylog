# iOS-проверка каждого PR. Job всегда завершается успешно при неизменных входных файлах,
# чтобы оставаться обязательной проверкой; сами сборка и тесты — в scripts/dev.sh (ADR-0011).
name: iOS

on:
  pull_request:
  push:
    branches: [main, release/v1.11]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: iOS
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Есть изменения для iOS
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed=true
          if [[ "$EVENT_NAME" != workflow_dispatch && "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] &&
              git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
                ios app/src/main/res/font app/src/main/assets/development \
                app/src/main/res/drawable/ic_launcher_foreground.xml \
                app/src/main/res/values/colors.xml \
                app/schemas fixtures scripts/dev.sh scripts/ios_launcher_icon.py; then
              changed=false
            fi
          fi
          echo "changed=$changed" >>"$GITHUB_OUTPUT"

      - name: Сборка и тесты на закреплённом симуляторе
        if: steps.changes.outputs.changed == 'true'
        run: scripts/dev.sh ios
