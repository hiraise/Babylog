# Релиз (ADR-0012): тег v<versionName> на коммите из main → подписанный APK и .sha256 в GitHub Releases.
# Сборка и проверка подписи — в scripts/dev.sh release, здесь только окружение и публикация.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Релиз
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Ключ подписи — в секретах окружения release, а оно выдаёт их только тегам v*
    environment: release
    permissions:
      contents: write # создать GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Тег стоит на коммите из main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.BABYLOG_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.jks"

      - name: Подписанный APK
        env:
          BABYLOG_KEYSTORE: ${{ runner.temp }}/release.jks
          BABYLOG_KEYSTORE_PASSWORD: ${{ secrets.BABYLOG_KEYSTORE_PASSWORD }}
        run: scripts/dev.sh release "$GITHUB_REF_NAME"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" build/release/*
          --verify-tag --generate-notes --title "Дневник малыша ${GITHUB_REF_NAME#v}"
