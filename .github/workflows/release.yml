# Релиз (ADR-0053): тег на коммите из main → подписанные APK/AAB, TestFlight и закрытое тестирование Play.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android и GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Тег стоит на коммите из main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.BABYLOG_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/release.jks"

      - name: Подписанные APK и AAB
        env:
          BABYLOG_KEYSTORE: ${{ runner.temp }}/release.jks
          BABYLOG_KEYSTORE_PASSWORD: ${{ secrets.BABYLOG_KEYSTORE_PASSWORD }}
        run: scripts/dev.sh release "$GITHUB_REF_NAME"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" build/release/*
          --verify-tag --generate-notes --title "Дневник малыша ${GITHUB_REF_NAME#v}"

      - name: Закрытое тестирование Google Play
        env:
          PLAY_JSON_KEY_PATH: ${{ runner.temp }}/play-service-account.json
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 -d >"$PLAY_JSON_KEY_PATH"
          bundle exec fastlane play_closed

      - name: Удалить магазинный ключ
        if: always()
        run: rm -f "${{ runner.temp }}/play-service-account.json"

  ios:
    name: TestFlight
    runs-on: xcode-27
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Тег стоит на коммите из main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Distribution-сертификат и профиль
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -d >"$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d >"$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/distribution.p12" \
            -k "$keychain_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/babylog-ci.mobileprovision"

      - name: Сборка и загрузка в TestFlight
        env:
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: bundle exec fastlane ios testflight

      - name: Удалить временные ключи
        if: always()
        run: |
          security delete-keychain "${{ runner.temp }}/build.keychain-db" || true
          rm -f "${{ runner.temp }}/distribution.p12" "${{ runner.temp }}/profile.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/babylog-ci.mobileprovision"
